[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "privacylens"
version = "0.1.0"
description = "Transparent PII masking for LLM clients — keep sensitive data out of your AI prompts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]
keywords = ["pii", "privacy", "llm", "openai", "anthropic", "masking", "tokenization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Madan2248c/privacylens"
Repository = "https://github.com/Madan2248c/privacylens"
Issues = "https://github.com/Madan2248c/privacylens/issues"

[project.optional-dependencies]
pii = ["presidio-analyzer", "presidio-anonymizer"]
semantic = ["gliner"]
redis = ["redis"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "respx>=0.20",
    "httpx>=0.25",
    "openai>=1.0",
    "anthropic>=0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/privacylens"]

[tool.hatch.envs.default]
features = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
