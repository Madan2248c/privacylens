site_name: PrivacyLens
site_description: Transparent PII masking for LLM clients
site_url: https://madan2248c.github.io/privacylens/
repo_url: https://github.com/Madan2248c/privacylens
repo_name: Madan2248c/privacylens
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Detectors: detectors.md
  - Adapters: adapters.md
  - Writing a Custom Detector: writing-a-custom-detector.md
